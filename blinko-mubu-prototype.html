        + ` C${stemX},${y - from * rk * 0.4} ${stemX + dir * rk * 0.4},${y} ${stemX + dir * rk},${y}`
        + ` L${xe},${y}`,
        st.color, st.w, st.o
      );
    });
  });

  /* 折叠钮：幕布风格 —— 贴在节点「朝向父节点」那一侧的边缘上，纵向居中。
   幕布截图实证：子级在右、折叠钮在节点左缘；子级在左、折叠钮在右缘 —— 即永远朝父。
   --fx/--fy = 按钮中心相对本节点盒左上角的偏移，由 mmDrawLinks 写入。 */
  const foldSrc = posMap || mmModel;
  foldSrc.forEach((m, id) => {
    if (!m.parentId) return;
    const p = foldSrc.get(m.parentId);
    const el = mmEls.get(id);
    if (!p || !el) return;
    const parentOnLeft = m.x >= p.x;              /* 子在父右边 → 朝父的一侧是左缘 */
    el.style.setProperty('--fx', (parentOnLeft ? 0 : m.w) + 'px');
    el.style.setProperty('--fy', (m.h / 2) + 'px');
  });
}

/* 布局后的公共收尾：同步 DOM 归属 + 叠加拖动偏移 + 归一化。 */
function mmApplyDragsAndFinish(models) {
  models.forEach((m, id) => {
    const el = mmEls.get(id);
    if (!el) return;
    if (m.side < 0) el.dataset.side = '-1';
    else delete el.dataset.side;
  });
  models.forEach((m, id) => {
    const d = mmDrags.get(id);
    if (d) { m.x += d.dx; m.y += d.dy; m.dragged = true; }
  });
  mmDrags.forEach((_, id) => { if (!models.has(id)) mmDrags.delete(id); });
  mmFinishLayout(models);
}

/* ============================================================
 * markmap 引擎适配层（只服务于「思维导图」结构）
 *
 *   大纲 DOM 仍然是唯一数据源。这里做三件事：
 *     ① 快照 → 左右两棵 markmap 纯节点树（双侧投影）
 *     ② 两棵树在 stage 上各自对齐 + 左树镜像，拼成幕布那种「中心主题 + 左右展开」
 *     ③ 导图上的点击 / 编辑 / 折叠 回写大纲 DOM
 *
 *   markmap 原生只有单向布局（根在左、全部子节点在右），而幕布是左右双侧。
 *   与其去改 d3-flextree 的坐标（改了就得连带重算每条 link 的 path），不如
 *   **拆成两个 Markmap 实例**，左实例整棵 <g> 做 scaleX(-1)：
 *     · 两边根节点是同一份内容、同一套 options，量出来的尺寸天然一致 → 精确对称
 *     · markmap 自己保证「根垂直居中于自己那半边的子树」，两边根一重合，
 *       左右就自动以中心主题对称展开 —— 正是幕布的样子
 *   左树的文字靠两层 scaleX(-1) 反镜像回来（盒子位置翻一次、字翻两次）。
 *
 *   markmap 的 d3.zoom / wheel pan 全关（zoom:false / pan:false / autoFit:false），
 *   平移缩放统一由 .mm-mk-stage 上的 mmView 驱动 —— 两个实例各挂一个 zoom 必然打架，
 *   而且我们本来就需要「两个实例一起动」的统一视角。
 *
 * ⚠ 四条实测踩出来的契约（照直觉写必炸，官方文档也没写全）：
 *   ① children 必须是**数组**，叶节点给 []，不能给 undefined
 *      —— renderData 里是 node.children.map(...)，给 undefined 直接抛
 *   ② payload.fold 语义是「**已折叠**」：1 = 折叠，缺省/0 = 展开
 *      —— 反了的话整棵树只渲染出根节点（foreignObject 数 == 1）
 *   ③ Markmap 要的是 <svg> 元素，喂 div 会静默不渲染（不报错、就是空白）
 *   ④ 节点身份认准 <g>.__data__（d3 绑的数据），别按 DOM 顺序、也别按 data-path 反查
 *      —— markmap 的 join key 含先序编号和文本哈希，插删改一个字就让下游整段 key 全变，
 *         旧 <g> 进 exit 后**不会被删除**（它从不调 .exit().remove()），
 *         却还带着上一帧的 data-path 和文本留在 DOM 里当幽灵；
 *         data-path 也只在 enter 时写一次，复用旧壳时永远停在上一帧。
 *         __data__ 才是唯一可靠的（d3 的 exit 选择器不更新 __data__，见 mmMkStampIds）
 * ============================================================ */
/* markmap 模块就绪握手：模块脚本在主脚本之后执行，这里既要接事件，
   也要兜底检查一次（模块可能在主脚本之后就已经 ready 了）。 */
function mmMkOnReady() {
  mmMkApi = window.MM_MK_API;
  if (!mmMkApi) { console.warn('[mm] markmap 不可用，思维导图暂用内置引擎占位'); return; }
  mmMkBindDom();
  if (mmActive && mmMkIsActive()) mmMkEnsure();
}
window.addEventListener('mm-mk-ready', mmMkOnReady);
if (window.MM_MK_API !== undefined) mmMkOnReady();
let mmMkApi = null;                 /* { Markmap, defaultOptions } */
let mmMk = null;                    /* { r, l } 两个 Markmap 实例 */

function mmMkIsActive() { return mmLayout.key === 'mindmap'; }

/* ---- ① 快照 → 左右两棵 markmap 树 ---- */

/* 一级分支按「累计叶子数过半」切一刀：靠前的兄弟走左、靠后的走右。
   这样左右都是文档里连续的一段，读起来符合从上到下的顺序（幕布/XMind 的做法），
   而不是左右交替把顺序打乱。 */
function mmMkSplit(root) {
  const kids = root.children || [];
  if (kids.length === 0) return { left: [], right: [] };
  const weight = (n) => 1 + (n.children || []).reduce((s, c) => s + weight(c), 0);
  const total = kids.reduce((s, k) => s + weight(k), 0);
  let acc = 0, cut = 0;
  while (cut < kids.length - 1 && acc < total / 2) { acc += weight(kids[cut]); cut += 1; }
  return { left: kids.slice(0, cut), right: kids.slice(cut) };
}

/* 快照节点 → markmap 纯节点。ci = 分支配色序号（取自**原始**兄弟下标，
   这样左右两棵树里同一条分支颜色一致，不会各从 palette[0] 重新数一遍）。 */
function mmMkConv(n, ci) {
  const payload = { __id: n.id, __ci: ci };
  if (n.folded) payload.fold = 1;
  return {
    content: n.html,
    payload,
    children: (n.children || []).map((c, i) => mmMkConv(c, i)),
  };
}
/* 一侧 = 根 + 该侧一级分支。两侧的根是同一个节点（左右都会出现一份），
   左实例那份用 visibility:hidden 藏掉，只保留它的尺寸用于对称。 */
function mmMkTree(root, kids) {
  const conv = (n, ci) => mmMkConv(n, ci);
  return conv({ ...root, children: kids }, 0);
}
function mmMkBuild() {
  const snap = mmSnapshot();
  const { left, right } = mmMkSplit(snap);
  return {
    snap,
    r: mmMkTree(snap, right),
    l: mmMkTree(snap, left),
    color: (branchIndex) => {
      const palette = mmTheme.palette || ['#888'];
      return palette[(branchIndex || 0) % palette.length];
    },
  };
}

/* ---- ② 布局对齐 + 包围盒 ---- */

function mmMkRootRect(inst) {
  const d = inst && inst.mk && inst.mk.state && inst.mk.state.data;
  return d && d.state ? d.state.rect : null;
}

/* 某个实例的 state.rect（markmap 自己的坐标）换算到 stage 坐标。
   右实例：原样 + 居中平移；左实例：先把 x 取反（scaleX(-1)）再居中平移。 */
function mmMkBoundsOf(inst, mirrored) {
  const root = mmMkRootRect(inst);
  const r = inst.mk.state.rect;
  if (!root || (!r.x1 && !r.y1 && !r.x2 && !r.y2)) return null;
  /* mmMkPlace 把根盒中心摆在 stage 原点 */
  const dy = -root.y - root.height / 2;
  if (!mirrored) return { x1: r.x1, y1: r.y1 + dy, x2: r.x2, y2: r.y2 + dy };
  const ax = -root.width / 2;
  return { x1: ax - r.x2, y1: r.y1 + dy, x2: ax - r.x1, y2: r.y2 + dy };
}
function mmMkBounds() {
  if (!mmMk) return null;
  const a = mmMkBoundsOf(mmMk.r, false);
  const b = mmMkBoundsOf(mmMk.l, true);
  if (!a) return b;
  if (!b) return a;
  return {
    x1: Math.min(a.x1, b.x1), y1: Math.min(a.y1, b.y1),
    x2: Math.max(a.x2, b.x2), y2: Math.max(a.y2, b.y2),
  };
}

/* 渲染完成后把 stage 坐标对齐好：两个实例的根盒中心都摆到 (0,0)，
   左树整体 x 取反，于是中心主题正好压在 stage 原点、左右两半对称展开。
   ⚠ mk.g 是 d3 selection（不是 DOM 元素），要改 transform 得走 .attr()。 */
function mmMkPlace() {
  if (!mmMk) return;
  const rr = mmMkRootRect(mmMk.r);
  const lr = mmMkRootRect(mmMk.l);
  if (rr) {
    mmMk.r.mk.g.attr('transform',
      `translate(${-rr.x - rr.width / 2},${-rr.y - rr.height / 2})`);
  }
  if (lr) {
    mmMk.l.mk.g.attr('transform',
      `translate(${lr.width / 2},${-lr.y - lr.height / 2}) scale(-1,1)`);
  }
  const b = mmMkBounds();
  if (b) mmLayoutSize = { w: b.x2 - b.x1, h: b.y2 - b.y1 };
}

/* ---- markmap options ---- */
/* 主题 → color / lineWidth 回调。分支色按 payload.__ci 取，
   保证左右两侧同一条分支同色。 */
function mmMkOptions() {
  const { defaultOptions } = mmMkApi;
  const center = mmTheme.center || '#666';
  return {
    ...defaultOptions,
    embedGlobalCSS: true,
    duration: 200,
    initialExpandLevel: -1,     /* 折叠状态完全由大纲决定 */
    /* 三件套必须关：markmap 自己的 zoom / 滚轮平移 / 自动 fit，
       全部让位给我们统一的 mmView（两个实例共用一个视角）。 */
    zoom: false,
    pan: false,
    autoFit: false,
    fitRatio: 0.86,
    paddingX: 8,
    spacingHorizontal: 88,      /* 父子列距 */
    spacingVertical: 16,        /* 同父兄弟缝；markmap 内部对跨父自动 ×2 */
    color: (node) => {
      /* markmap 的 depth 是 1-based：根 = 1，根的孩子（一级分支）= 2。
         只有根自己用中心色，一级分支往下全用自己那条分支的颜色 —— 幕布就是这样分色的。 */
      if (!node.parent) return center;
      return mmMkColorOf(node);
    },
    lineWidth: (node) => (node.state.depth <= 2 ? 2.5 : 1.6),
  };
}
let mmMkColorFn = () => '#888';
function mmMkColorOf(node) {
  const p = node && node.payload;
  return mmMkColorFn(p ? p.__ci : 0);
}

/* 渲染完成后给每个节点组打身份标记。
 *
 * ⚠ 顺带必须做一件 markmap 自己不做的事：**把退出的幽灵 <g> 摘掉**。
 * markmap-view 的 renderData 里 `mmGExit` 只用来取 originNode，从头到尾没有
 * `.exit().remove()`（见 markmap-view@0.18.12 src/view.ts L380-390）。而它的
 * join key = `父先序id.自己先序id + hash(文本)` —— 插入/删除/改一个字，
 * 后面所有兄弟的先序 id 全变，key 全变，于是那一整段旧 <g> 全都进了 exit，
 * 却还留在 DOM 里，带着上一帧的 data-mm-id 和上一帧的文本。
 *
 * 后果实测很具体：mmEditBox(id) 用 querySelector 抓到的是幽灵，于是把焦点
 * 打进一个即将被复用的壳里，下一帧它被拿去渲染别的节点 —— focus/blur 当场
 * 把用户的编辑掐掉，Enter 新建的节点一进去就掉出编辑态。
 *
 * 判活办法：d3 的 exit 选择器**不会**更新 node.__data__（bindKey 里只有
 * update/enter 会写），而 live 节点的 __data__ 一定在当前这棵 state.data 里。
 * 所以「__data__ 不在当前树中」= 幽灵，直接 remove。
 *
 * 身份取 __data__ 而不是 data-path：data-path 只在 enter 时写一次，
 * 被复用的旧壳永远带着上一帧的路径。 */
function mmMkStampIds(inst) {
  const data = inst && inst.mk && inst.mk.state && inst.mk.state.data;
  if (!data) return;
  /* ⚠️ 必须按 state.key（join key）判活，不能按引用。
   * d3 的 exit 选择器**不会**更新 __data__，所以旧 <g> 的 __data__ 指向旧树对象，
   * 引用比较能命中；但 markmap 在每个 <g> 里加一条 <line> 指向父 <circle>，
   * 如果父 <g> 是 update 而子 <g> 是 exit，子 <g> 没摘掉时 <line> 仍指旧坐标，
   * 会画出那条诡异的粗曲线。
   * 用 state.key 比较：旧 key 不在新树的 liveKey 集合里 → 直接摘。 */
  const liveKeys = new Set();
  (function walk(n) {
    if (n && n.state && n.state.key) liveKeys.add(n.state.key);
    (n.children || []).forEach(walk);
  })(data);
  const groups = inst.el.querySelectorAll('g.markmap-node');
  for (const g of groups) {
    const node = g.__data__;
    const k = node && node.state && node.state.key;
    if (!k || !liveKeys.has(k)) { g.remove(); continue; }
    if (!node.payload || !node.payload.__id) continue;
    g.setAttribute('data-mm-id', node.payload.__id);
    g.setAttribute('data-mm-depth', String(node.state.depth));
    g.style.setProperty('--mm-c', mmMkColorOf(node));
  }
}

/* ---- ③ 同步 / 创建 / 销毁 ---- */

function mmMkSync() {
  if (!mmMk || !mmMkIsActive() || !mmActive) return;
  const built = mmMkBuild();
  mmMkColorFn = built.color;
  const opts = mmMkOptions();
  mmMk.r.mk.setOptions(opts);
  mmMk.l.mk.setOptions(opts);
  /* 钩在 renderData 上（见 mmMkHook），对齐/fit 每次重算都会跑，这里只管喂数据 */
  Promise.all([
    Promise.resolve(mmMk.r.mk.setData(built.r)),
    Promise.resolve(mmMk.l.mk.setData(built.l)),
  ]).catch((e) => console.warn('[mm] markmap 渲染失败', e));
}

function mmMkDestroy() {
  if (!mmMk) return;
  /* 切走 markmap 模式时把 FAB 顺手藏了，否则会浮在不该有的地方 */
  const fab = document.getElementById('mm-fab');
  if (fab) fab.hidden = true;
  ['r', 'l'].forEach((s) => { try { mmMk[s].mk.destroy(); } catch (e) { /* ignore */ } });
  mmMk = null;
}

/* ⚠ 必须钩 renderData，而不是 setData 的 then。
   markmap 首次渲染时节点尺寸还是 [0,0]（`_relayout` 量的是 foreignObject 里的
   el.scrollWidth），要等 ResizeObserver 异步回调再触发一次 renderData 才量得到真值。
   也就是说 setData().then() 里拿到的多半是**首帧的空布局**——
   之前就因为这个只算出了半张图的位置，左半边整片跑到视口外。 */
function mmMkHook(inst) {
  const mk = inst.mk;
  const orig = mk.renderData.bind(mk);
  mk.renderData = function () {
    return orig().then(() => {
      const d = mk.state.data;
      /* 首帧尺寸还没量出来，跳过 —— 否则会按空包围盒闪一下 */
      if (!d || !d.state || !(d.state.rect.width > 0)) return;
      mmMkStampIds(inst);
      mmMkPlace();
      /* 树模型跟着重排刷新：键盘导航/提降级/拖拽命中都靠它 */
      mmTree = mmBuildTree();
      syncMmSelectionClasses();
      mmAutoFit();
      mmPositionFab();          /* markmap 每次重排后，FAB 跟着选中节点重新摆位 */
      mmMkPositionGrip();       /* 抓手也得跟上 */
    });
  };
}

function mmMkEnsure() {
  if (mmMk || !mmMkApi || !mmActive) return;
  try {
    const opts = mmMkOptions();
    mmMk = {
      r: { el: mmEl.mkR, mk: new mmMkApi.Markmap(mmEl.mkR, opts) },
      l: { el: mmEl.mkL, mk: new mmMkApi.Markmap(mmEl.mkL, opts) },
    };
    mmMkHook(mmMk.r);
    mmMkHook(mmMk.l);
    mmMkSync();
  } catch (e) {
    console.warn('[mm] markmap 初始化失败', e);
  }
}

/* ---- 交互回写大纲 ---- */
/* markmap-view 0.18 没有事件系统，事件都挂在渲染出来的节点 DOM 上，
   这里用事件委托 + data-mm-id 反查（见 mmMkStampIds）。 */
function mmMkBindDom() {
  const stage = mmEl.stage;
  if (!stage || stage.dataset.mkBound) return;
  stage.dataset.mkBound = '1';

  const idOf = (e) => {
    const g = e.target.closest && e.target.closest('g.markmap-node[data-mm-id]');
    return g ? g.getAttribute('data-mm-id') : null;
  };

  /* ⚠ 三个监听器**必须用捕获阶段**。
     markmap 给每个 foreignObject 绑了 `mousedown` / `dblclick` 的 stopPropagation
     （见 markmap-view 的 mmFoEnter），事件根本冒泡不到 stage ——
     用默认的冒泡监听的话，点节点会完全没反应（选中、编辑、折叠同步全失效）。
     捕获在目标之前就跑完，stopPropagation 拦不住它。 */
  stage.addEventListener('mousedown', (e) => {
    const id = idOf(e);
    if (!id) return;
    /* 点节点本体 = 选中；点折叠钮由 markmap 自己处理，别抢 */
    if (e.target.closest('circle')) return;
    if (e.button !== 0) return;
    mmSelect(id);
    /* 按下先不拖，move 超过阈值才升级成拖拽 —— 这样单击仍然是「选中」。
       中心主题固定不可拖（和幕布一致）。 */
    if (id !== MM_ROOT_ID && !mmEditingId) mmMkDragStart(e, id);
  }, true);

  /* 双击进编辑：把 markmap 节点的文本层变成 contenteditable，
     失焦/回车时写回大纲 DOM —— 大纲仍是唯一数据源。 */
  stage.addEventListener('dblclick', (e) => {
    const id = idOf(e);
    if (!id) return;
    if (!e.target.closest('.markmap-foreign')) return;
    e.preventDefault();
    /* 和 F2 / Enter / Tab 走同一条编辑生命周期（mmStartEdit + mmCommitEdit） */
    mmStartEdit(id);
  }, true);

  /* 折叠状态同步：markmap 收起一个节点 → 大纲里对应 topic 也标成 folded。
     同样要捕获（折叠钮的 click 是 markmap 自己绑的），
     而且 markmap 的 renderData 是异步的，冒泡到我们这里时 payload.fold 还没落定，
     所以再延 300ms 等它算完。 */
  stage.addEventListener('click', (e) => {
    if (!e.target.closest || !e.target.closest('circle')) return;
    setTimeout(() => mmMkWriteBackFold(), 300);
  }, true);

  /* ---- hover 高亮 + 拖拽时给候选节点打 is-mm-target ----
     markmap 自己的鼠标事件会 stopPropagation 拦不到 stage 冒泡，
     但 mousemove 不在拦截名单里，捕获阶段跑就够了。 */
  stage.addEventListener('mousemove', (e) => {
    if (mmEditingId) return;            /* 编辑态别盖「可输入」光标 */
    const g = e.target.closest && e.target.closest('g.markmap-node[data-mm-id]');
    if (mmMk && mmMk.hover) mmMk.hover.classList.remove('is-mm-hover');
    if (g && g.getAttribute('data-mm-id') !== mmSelectedId) {
      g.classList.add('is-mm-hover');
      mmMk.hover = g;
    } else {
      mmMk.hover = null;
    }
  }, true);
  stage.addEventListener('mouseleave', () => {
    if (mmMk && mmMk.hover) { mmMk.hover.classList.remove('is-mm-hover'); mmMk.hover = null; }
  });
}

/* ============================================================
 * markmap 模式：拖拽改层级（改父节点 / 改兄弟顺序）
 *
 * 内置引擎的拖拽是「挪位置」（位移记进 mmDrags 的偏移量）。
 * markmap 的坐标由 d3-flextree 决定，挪不动也没意义 ——
 * 它的拖拽语义是**改结构**：把节点挂到别的父节点下，或插到别的兄弟位置。
 *
 * 判定规则（幕布 / XMind 同款心智模型，细则见 mmMkFindTarget）：
 *   · 指针**压在某个节点上** → 成为它的**子级**（它自动展开）
 *   · 指针落在节点之间的**空档** → 成为那一列的**兄弟**，插入位置按纵坐标定
 *   · 不允许落进自己的子树里（否则整棵子树会变成自己的后代）
 *
 * 落点最终写回大纲 DOM（唯一数据源），再走一次 mmMkSync 重新分侧 + 重排。
 * ============================================================ */
let mmMkDrag = null;

function mmMkSubtreeIds(id) {
  const set = new Set([id]);
  const walk = (x) => {
    const m = mmTree.get(x);
    if (!m) return;
    m.childIds.forEach((c) => { if (!set.has(c)) { set.add(c); walk(c); } });
  };
  walk(id);
  return set;
}

/* 收集当前**可见**节点的屏幕矩形（被折叠的子树不在 DOM 里，自然就不参与命中）。
   这是 markmap 双侧唯一的坐标系来源：DOM rect 就是事实，不需要反推布局。 */
function mmMkCollectRects(exclude) {
  const map = new Map();
  document.querySelectorAll('#mm-mk-stage g.markmap-node[data-mm-id]').forEach((g) => {
    const id = g.getAttribute('data-mm-id');
    if (!id || exclude.has(id)) return;
    /* 左实例的根只是占位（visibility:hidden），不是真实节点，排除掉 */
    if (g.closest('#mm-mk-l') && g.getAttribute('data-mm-depth') === '1') return;
    const fo = g.querySelector('foreignObject');
    if (!fo) return;
    const b = fo.getBoundingClientRect();
    if (!b.width && !b.height) return;
    map.set(id, {
      id,
      side: g.closest('#mm-mk-l') ? -1 : 1,
      depth: parseInt(g.getAttribute('data-mm-depth'), 10) || 1,
      left: b.left, right: b.right, top: b.top, bottom: b.bottom,
      cy: (b.top + b.bottom) / 2,
    });
  });
  return map;
}

/* 落点判定。判定的是「意图」，不是几何 —— 坐标由 d3-flextree 摆出来，
 * 指针落在哪不等于用户想要什么。
 *
 * 手感对齐 XMind / 幕布：
 *   · 指针**压在某个节点盒子上** → 成为它的**子级**（拖到谁身上就是谁的孩子）
 *   · 指针落在盒子之间的**空档**里 → 成为那一列的**兄弟**，插入位置看纵向坐标
 *   · 离所有列都远 → 本次没有落点，取消
 *
 * ⚠ 别再用早期那套「外半边=子级 / 内半边=兄弟」：双侧镜像下「外」的方向
 * 是跟着左右翻的（左边那半棵树的外侧朝左），用户根本判断不出自己在往里拖
 * 还是往外拖，实测就出现了「明明把节点拖到了它右边缘却成了兄弟」。
 * 压在节点上永远是「我要当它的孩子」，没有歧义。 */
function mmMkFindTarget(rects, cx, cy) {
  const PAD = 5;                /* 压中盒子的容差 */
  const V_TOL = 48;             /* 空档判定的纵向容差（屏幕像素） */

  /* ① 压中盒子 → 子级。左右两侧各有一棵树，同一坐标可能被两个盒子同时罩住
        （左右列宽接近中心时），取更深的那一个 —— 那才是用户视觉上点中的。 */
  let hit = null;
  rects.forEach((c) => {
    if (cx < c.left - PAD || cx > c.right + PAD) return;
    if (cy < c.top - PAD || cy > c.bottom + PAD) return;
    if (!hit || c.depth > hit.depth) hit = c;
  });
  if (hit) return { mode: 'child', parentId: hit.id, index: -1, rect: hit, parentRect: hit };

  /* ② 空档 → 兄弟。横向代价用「到盒子跨度外的距离」而不是到中点的距离：
        盒子横向跨度内代价恒为 0，于是在同一列里纯粹比纵向谁最近；
        一旦跑到某一列的左边或右边，才开始按横向距离罚分选列。 */
  let best = null;
  rects.forEach((c) => {
    const dy = Math.abs(c.cy - cy);
    if (dy > V_TOL) return;
    const dx = cx < c.left ? c.left - cx : (cx > c.right ? cx - c.right : 0);
    const cost = dx + dy * 0.6;
    if (!best || cost < best.cost) best = { c, cost };
  });
  if (!best) return null;

  const cm = mmTree.get(best.c.id);
  const parentId = cm ? cm.parentId : MM_ROOT_ID;
  /* 插入下标 = 「最后一个纵坐标在指针上方的可见兄弟」的下标 +1。
     注意不能遇到没有矩形的（被折叠的）就 break —— 那样下标会算少。 */
  const siblings = mmMkSiblingIds(parentId);
  let index = 0;
  for (let i = 0; i < siblings.length; i++) {
    const r = rects.get(siblings[i]);
    if (r && r.cy < cy) index = i + 1;
  }
  const pr = parentId === MM_ROOT_ID ? null : rects.get(parentId);
  return { mode: 'sibling', parentId, index, rect: best.c, parentRect: pr || best.c };
}

function mmMkSiblingIds(parentId) {
  const sel = parentId === MM_ROOT_ID
    ? '#outline > .topic'
    : `#outline li[data-id="${CSS.escape(parentId)}"] > .topic-children > .topic`;
  return Array.from(document.querySelectorAll(sel)).map((li) => li.dataset.id);
}

function mmMkPaintDrop(d, cy) {
  const t = d.target;
  if (_mmBarBadge) _mmBarBadge.style.display = 'none';
  if (_mmBarMini)  _mmBarMini.style.display  = 'none';
  if (!t) { d.bar.hidden = true; d.bar.dataset.folded = '0'; return; }
  d.bar.hidden = false;
  if (t.mode === 'child') {
    const r = t.rect;
    /* 命中折叠中的父 → 用迷你预览样式（虚线 + 角标"展开后含 N 项"） */
    const isFolded = !!(d.targetEl && d.targetEl.classList.contains('markmap-fold'));
    let cnt = 0;
    if (isFolded) {
      const m = mmTree.get(t.rect.id);
      cnt = m ? m.childIds.length : 0;
    }
    d.bar.dataset.folded = isFolded ? '1' : '0';
    d.bar.dataset.foldedCount = String(cnt);
    d.bar.className = isFolded ? 'mm-drag-bar is-ring is-folded' : 'mm-drag-bar is-ring';
    d.bar.style.left = (r.left - 5) + 'px';
    d.bar.style.top = (r.top - 5) + 'px';
    d.bar.style.width = (r.right - r.left + 10) + 'px';
    d.bar.style.height = (r.bottom - r.top + 10) + 'px';
    if (isFolded && _mmBarMini) {
      _mmBarMini.querySelector('.mini-title').textContent = `展开后 ${cnt} 个子`;
      _mmBarMini.style.display = 'flex';
    }
    return;
  }
  /* 同级插入：放大版横线 —— 8px 高度，两端三角，末端"⊕ 插入这里"小角标。
   * 横跨父节点所在的那一列，让用户一眼能看出"插到这两行之间"。 */
  const pr = t.parentRect;
  const left = Math.min(pr.left, t.rect.left) - 18;
  const right = Math.max(pr.right, t.rect.right) + 18;
  d.bar.className = 'mm-drag-bar is-line';
  d.bar.style.left = left + 'px';
  d.bar.style.width = (right - left) + 'px';
  d.bar.style.top = (cy - 4) + 'px';
  if (_mmBarBadge) {
    _mmBarBadge.textContent = d.copyMode ? '⊕ 复制到此' : '⊕ 插入这里';
    _mmBarBadge.classList.toggle('is-copy', !!d.copyMode);
    _mmBarBadge.style.display = 'block';
  }
}

function mmMkDragStart(e, id) {
  mmMkDrag = {
    id, startX: e.clientX, startY: e.clientY, moved: false,
    target: null, rects: null, ghost: null, bar: null,
    copyMode: !!(e && e.altKey),   /* Alt/Option + drop = 复制而非移动 */
  };
  window.addEventListener('mousemove', mmMkDragMove);
  window.addEventListener('mouseup', mmMkDragEnd);
  window.addEventListener('keydown', mmMkDragKey, true);
}

/* 兄弟指示的「⊕ 插入这里」角标：纯 DOM 注入，避免和 ::before/::after 三角冲突 */
let _mmBarBadge = null;        /* 单例，重复利用 */
let _mmBarMini = null;
function mmMkEnsureBarBadges(bar) {
  if (!_mmBarBadge) {
    _mmBarBadge = document.createElement('div');
    _mmBarBadge.className = 'mm-bar-badge';
    _mmBarBadge.textContent = '⊕ 插入这里';
  }
  if (!_mmBarMini) {
    _mmBarMini = document.createElement('div');
    _mmBarMini.className = 'mm-bar-mini';
    _mmBarMini.innerHTML = '<div class="mini-title">展开后</div>'
      + '<div class="mini-row"></div><div class="mini-row"></div><div class="mini-row"></div>';
  }
  if (!_mmBarBadge.parentElement) bar.appendChild(_mmBarBadge);
  if (!_mmBarMini.parentElement) bar.appendChild(_mmBarMini);
  _mmBarBadge.style.display = 'none';
  _mmBarMini.style.display = 'none';
}

function mmMkDragMove(e) {
  const d = mmMkDrag;
  if (!d) return;
  if (!d.moved) {
    if (Math.abs(e.clientX - d.startX) + Math.abs(e.clientY - d.startY) < 5) return;
    d.moved = true;
    e.preventDefault();
    d.rects = mmMkCollectRects(mmMkSubtreeIds(d.id));
    d.ghost = document.createElement('div');
    d.ghost.className = 'mm-drag-ghost';
    const m = mmTree.get(d.id);
    d.ghost.innerHTML = (m && m.html) || '';
    document.body.appendChild(d.ghost);
    d.bar = document.createElement('div');
    d.bar.className = 'mm-drag-bar';
    d.bar.hidden = true;
    document.body.appendChild(d.bar);
    mmMkEnsureBarBadges(d.bar);   /* 首次创建时挂上「⊕ 插入这里」+ 折叠迷你预览 DOM */
    document.body.classList.add('mm-dragging');
  }
  d.ghost.style.transform = `translate(${e.clientX + 14}px, ${e.clientY + 12}px)`;
  /* Alt 切换复制模式：ghost 角标 + bar 角标同步 */
  d.copyMode = !!e.altKey;
  if (d.ghost._copy !== d.copyMode) {
    d.ghost._copy = d.copyMode;
    /* 复制模式：ghost 角标加个「+副本」前缀，CSS 会用 ::before 渲染 */
    d.ghost.classList.toggle('is-copy', d.copyMode);
  }
  d.target = mmMkFindTarget(d.rects, e.clientX, e.clientY);
  /* 把当前候选节点打上 is-mm-target —— CSS 会让它变亮一档，非候选节点则 dim。
     移开 / 取消时要清干净。 */
  const wantId = d.target && d.target.rect && d.target.rect.id;
  if (d.targetElId !== wantId) {
    if (d.targetEl) d.targetEl.classList.remove('is-mm-target');
    d.targetEl = wantId
      ? document.querySelector(`#mm-mk-stage g.markmap-node[data-mm-id="${CSS.escape(wantId)}"]`)
      : null;
    d.targetElId = wantId;
    if (d.targetEl) d.targetEl.classList.add('is-mm-target');
  }
  mmMkPaintDrop(d, e.clientY);
  /* 实时连接预览线：源节点中心 → 鼠标。
   * source center = d.id 那个 markmap <g> 里的 foreignObject 中心；
   * mode 跟 d.target.mode 走：有目标 = child / sibling，无目标 = none。 */
  const srcEl = document.querySelector(`#mm-mk-stage g.markmap-node[data-mm-id="${CSS.escape(d.id)}"] foreignObject`);
  if (srcEl) {
    const r = srcEl.getBoundingClientRect();
    mmUpdateDragLine({
      sx: r.left + r.width / 2,
      sy: r.top + r.height / 2,
      ex: e.clientX, ey: e.clientY,
      mode: d.target ? d.target.mode : 'none',
    });
  }
}

function mmMkDragKey(e) {
  if (e.key !== 'Escape' || !mmMkDrag) return;
  e.preventDefault();
  e.stopPropagation();
  mmMkDrag.target = null;
  mmMkDragEnd();
}

function mmMkDragEnd() {
  window.removeEventListener('mousemove', mmMkDragMove);
  window.removeEventListener('mouseup', mmMkDragEnd);
  window.removeEventListener('keydown', mmMkDragKey, true);
  document.body.classList.remove('mm-dragging');
  const d = mmMkDrag;
  mmMkDrag = null;
  if (!d) return;
  if (d.ghost) d.ghost.remove();
  if (d.bar) d.bar.remove();
  if (d.targetEl) { d.targetEl.classList.remove('is-mm-target'); d.targetEl = null; d.targetElId = null; }
  mmHideDragLine();
  if (!d.moved || !d.target) return;      /* 只是点了一下 / 没有落点 → 交给选中逻辑 */
  mmMkApplyDrop(d.id, d.target, { copy: d.copyMode });
}

/* 落点写回大纲 DOM。深度、父的展开态一起修好，之后一次 mmRelayout 让两套引擎各自重排。
 * opts.copy = true：复制模式（Alt + drop）—— 把整棵子树克隆 + 重新发 id 后插入落点。 */
function mmMkApplyDrop(id, t, opts) {
  let li = mmLi(id);
  if (!li) return;
  opts = opts || {};
  /* 落点会改成结构 → 撤销栈要能回到原状，调用前先快照（仅 move；copy 也要记，
   * 因为原节点没动但大纲多了一组节点 —— 撤销 = 删掉新节点）。 */
  mmHistoryPush();
  let copyRoot = null;            /* 复制模式下：新建子树挂在哪个 li 下？ */
  if (opts.copy) {
    const clone = li.cloneNode(true);
    /* 克隆要重新发 id，否则会与原节点冲突（data-id 重复、mmTree 双重条目） */
    const oldToNew = new Map();
    clone.dataset.id = mmNewId();
    oldToNew.set(li.dataset.id, clone.dataset.id);
    clone.querySelectorAll('[data-id]').forEach((el) => {
      const nid = mmNewId();
      oldToNew.set(el.dataset.id, nid);
      el.dataset.id = nid;
    });
    /* markmap 的 mmTree 也得克隆一份 + 重新发 __id（payload.__id / __ci） */
    const oldTree = mmTree;
    const cloneSubtree = (oldId) => {
      const om = oldTree.get(oldId);
      if (!om) return null;
      const newId = oldToNew.get(oldId);
      const cm = {
        id: newId, parentId: null, depth: om.depth,
        html: om.html, folded: om.folded, hasChildren: om.hasChildren,
        childIds: om.childIds.map(cloneSubtree).filter(Boolean),
      };
      cm.childIds.forEach((c) => { c.parentId = newId; });
      mmTree.set(newId, cm);
      return cm;
    };
    cloneSubtree(id);
    /* 折叠态清掉：克隆出来默认展开，强制有子级时是父节点 */
    delete clone.dataset.state;
    copyRoot = clone;
    /* 注意：li 仍指向原节点，下面用 copyRoot 插入到 t 落点 */
  }
  let parentLi = null, parentUl = null;
  if (t.parentId === MM_ROOT_ID) {
    parentUl = document.getElementById('outline');
  } else {
    parentLi = mmLi(t.parentId);
    if (!parentLi) return;
    /* 不能落进自己的子树里 */
    if (parentLi === li || li.contains(parentLi)) return;
    parentUl = parentLi.querySelector(':scope > .topic-children');
    if (!parentUl) {
      parentUl = document.createElement('ul');
      parentUl.className = 'topic-children';
      parentLi.appendChild(parentUl);
    }
  }
  let index = t.index;
  /* 复制模式：插入克隆（不移动原 li）；move 模式：原 li 直接 insertBefore */
  if (copyRoot) {
    /* 同父插入：摘掉自身这一步不存在（克隆不在 outline 里），
       直接算 ref 然后 insertBefore。 */
    const ref = index < 0 ? null : (parentUl.children[index] || null);
    parentUl.insertBefore(copyRoot, ref);
    const depth = parentLi ? (parseInt(parentLi.dataset.depth, 10) || 0) + 1 : 1;
    updateDepth(copyRoot, depth);
    if (parentLi) parentLi.dataset.state = 'open';
    mmRelayout(true);
    /* 选中新克隆（id 已重发，原 id 仍指向原 li） */
    const newId = copyRoot.dataset.id;
    mmSelect(newId);
    mmMkScrollIntoView(newId);
    const label = (copyRoot.querySelector('.topic-content')?.textContent || newId).slice(0, 16);
    const parentLabel = parentLi
      ? (parentLi.querySelector(':scope > .topic-row > .topic-content')?.textContent || '').slice(0, 16)
      : '（一级）';
    mmToast(`已复制「${label}」到「${parentLabel}」下`, { undo: true });
    return;
  }
  /* 摘掉自身会改变同父兄弟的下标：从原位置往后插要让一格，否则会差一位 */
  const curUl = li.parentElement;
  if (curUl === parentUl) {
    const curIdx = Array.prototype.indexOf.call(parentUl.children, li);
    if (curIdx !== -1 && index > curIdx) index -= 1;
  }
  const ref = index < 0 ? null : (parentUl.children[index] || null);
  if (ref === li) return;
  parentUl.insertBefore(li, ref);
  const depth = parentLi ? (parseInt(parentLi.dataset.depth, 10) || 0) + 1 : 1;
  updateDepth(li, depth);
  if (parentLi) parentLi.dataset.state = 'open';   /* 折叠中的父自动展开 */
  mmRelayout(true);
  mmSelect(id);
  mmMkScrollIntoView(id);
  /* 操作反馈：右下角 toast 描述本次移动 + 配撤销按钮 */
  const label = (li.querySelector('.topic-content')?.textContent || id).slice(0, 16);
  const parentLabel = parentLi
    ? (parentLi.querySelector(':scope > .topic-row > .topic-content')?.textContent || '').slice(0, 16)
    : '（一级）';
  const verb = t.mode === 'child' ? '移到' : (parentLabel === '（一级）' ? '移到一级' : '改成兄弟');
  mmToast(`已把「${label}」${verb}「${parentLabel}」下`, { undo: true });
}

/* markmap 模式把选中节点滚进视口（用 DOM 矩形，不依赖模型坐标） */
function mmMkScrollIntoView(id) {
  const fo = document.querySelector(
    `#mm-mk-stage g.markmap-node[data-mm-id="${CSS.escape(id)}"] foreignObject`);
  if (!fo) return;
  const r = fo.getBoundingClientRect();
  const pad = 60;
  const W = window.innerWidth, H = window.innerHeight;
  let dx = 0, dy = 0;
  if (r.left < pad) dx = pad - r.left;
  else if (r.right > W - pad) dx = (W - pad) - r.right;
  if (r.top < pad) dy = pad - r.top;
  else if (r.bottom > H - pad) dy = (H - pad) - r.bottom;
  if (dx || dy) { mmView.tx += dx; mmView.ty += dy; mmApplyView(); }
}

/* markmap 渲染完的树 → 大纲 DOM 的 folded 状态（左右两棵树取并集） */
function mmMkWriteBackFold() {
  if (!mmMk) return;
  const state = new Map();
  ['r', 'l'].forEach((side) => {
    const root = mmMk[side].mk.state && mmMk[side].mk.state.data;
    if (!root) return;
    (function walk(n) {
      state.set(n.payload && n.payload.__id, n.payload && n.payload.fold ? 1 : 0);
      (n.children || []).forEach(walk);
    })(root);
  });
  state.forEach((folded, id) => {
    if (!id || id === MM_ROOT_ID) return;
    const li = document.querySelector(`#outline li[data-id="${CSS.escape(id)}"]`);
    if (!li) return;
    const now = li.dataset.state === 'folded';
    if (now !== !!folded) li.dataset.state = folded ? 'folded' : 'open';
  });
}

/* 大纲副标题（条主题 · 字数）在导图里改字后要跟着走 */
function mmUpdateSubtitle() {
  const el = document.querySelector('.stage .subtitle');
  if (!el) return;
  let topics = 0, chars = 0;
  document.querySelectorAll('#outline .topic').forEach((li) => {
    const c = li.querySelector(':scope > .topic-row > .topic-content');
    topics += 1;
    chars += c ? c.textContent.trim().length : 0;
  });
  const h1 = document.querySelector('.stage h1');
  if (h1) chars += h1.textContent.trim().length;
  el.textContent = `${topics + 1} 条主题 · ${(chars / 1000).toFixed(1)}k 字`;
}

function mmComputeLayout(models) {
  const root = models.get(MM_ROOT_ID);
  if (mmLayout.key === 'mindmap') mmLayoutMindmap(models, root);
  else if (mmLayout.key === 'bracket') mmLayoutBracket(models, root);
  else mmLayoutLogic(models, root);
  mmApplyDragsAndFinish(models);
}

/* ----- 重布局（含动画）：快照 → 元素同步 → 测量 → 布局 → rAF 插值 ----- */
function mmRelayout(animate = true) {
  if (!mmActive) return;
  /* markmap 引擎接管：它自己管渲染/缩放/平移/连线，
     我们只需要把大纲快照推过去。内置引擎的整条链路在下面，不动。 */
  if (mmMkIsActive()) {
    if (!mmMk) { mmMkEnsure(); if (mmMk) return; }
    mmMkSync();
    return;
  }
  const prev = mmModel;
  mmModel = mmBuildModels(mmSnapshot());
  const models = mmModel;

  /* 元素同步 + 测量（新建的先挂 DOM 再量 offsetWidth/Height） */
  models.forEach((m, id) => {
    let el = mmEls.get(id);
    if (!el) { el = mmCreateNode(m); mmEls.set(id, el); m.spawned = true; }
    mmUpdateNode(el, m);
    m.w = el.offsetWidth;
    m.h = el.offsetHeight;
  });

  mmComputeLayout(models);

  /* 退出可见集的节点（被折叠收进）→ 飞向最近可见祖先并淡出 */
  const removed = [];
  mmEls.forEach((el, id) => {
    if (models.has(id)) return;
    const pm = prev.get(id);
    let a = pm ? pm.parentId : null;
    while (a && !models.has(a)) a = prev.get(a) ? prev.get(a).parentId : null;
    removed.push({ id, el, anchorId: a, pm });
  });

  const setPos = (el, x, y) => { el.style.transform = `translate(${x}px, ${y}px)`; };

  if (!animate) {
    removed.forEach((r) => { r.el.remove(); mmEls.delete(r.id); });
    models.forEach((m) => setPos(mmEls.get(m.id), m.x, m.y));
    mmDrawLinks();
    mmAutoFit();
    mmPositionFab();
    return;
  }

  const entries = [];
  models.forEach((m) => {
    let fx = m.x, fy = m.y;
    if (m.spawned) {
      /* 新出现的节点（展开）：从父节点当前位置飞出 */
      const pp = m.parentId ? prev.get(m.parentId) : null;
      const pt = m.parentId ? models.get(m.parentId) : null;
      fx = pp ? pp.x : (pt ? pt.x : m.x);
      fy = pp ? pp.y : (pt ? pt.y : m.y);
      m.spawned = false;
    } else {
      const cm = prev.get(m.id);
      if (cm) { fx = cm.x; fy = cm.y; }
    }
    entries.push({ ref: m, el: mmEls.get(m.id), fx, fy, tx: m.x, ty: m.y });
  });
  removed.forEach((r) => {
    const cm = r.pm;
    const anchor = r.anchorId ? models.get(r.anchorId) : null;
    entries.push({
      ref: cm, el: r.el,
      fx: cm ? cm.x : 0, fy: cm ? cm.y : 0,
      tx: anchor ? anchor.x : (cm ? cm.x : 0),
      ty: anchor ? anchor.y : (cm ? cm.y : 0),
      removeId: r.id, fade: true,
    });
  });

  if (mmAnim) cancelAnimationFrame(mmAnim);
  /* 起点先落位，防止新节点在 (0,0) 闪一帧 */
  entries.forEach((en) => setPos(en.el, en.fx, en.fy));
  const dur = 280, t0 = performance.now();
  const posMap = new Map();
  const frame = (now) => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);            /* ease-out cubic */
    posMap.clear();
    entries.forEach((en) => {
      const x = en.fx + (en.tx - en.fx) * e;
      const y = en.fy + (en.ty - en.fy) * e;
      setPos(en.el, x, y);
      if (en.fade) en.el.style.opacity = String(1 - e * 0.7);
      posMap.set(en.ref.id, {
        x, y, w: en.ref.w, h: en.ref.h,
        color: en.ref.color, depth: en.ref.depth, parentId: en.ref.parentId,
        side: en.ref.side, childIds: en.ref.childIds,
      });
    });
    mmDrawLinks(posMap);
    if (p < 1) { mmAnim = requestAnimationFrame(frame); return; }
    mmAnim = null;
    entries.forEach((en) => {
      if (en.removeId) { en.el.remove(); mmEls.delete(en.removeId); }
      else en.el.style.opacity = '';
    });
    mmDrawLinks();                                /* 终态：从 model 画 */
    mmAutoFit();
    mmPositionFab();
  };
  mmAnim = requestAnimationFrame(frame);
}

/* ----- 选中 / 折叠 ----- */
/* 两套引擎的选中态各管各的：内置引擎给 DOM 节点加类，markmap 给渲染出来的
   <g class="markmap-node"> 加类（身份靠 mmMkStampIds 按 __data__ 盖上的 data-mm-id）。
   左右两个实例都可能有同一个节点（只有根会），一起更新。 */
function syncMmSelectionClasses() {
  if (!mmEl.stage) return;
  mmEl.stage.querySelectorAll('g.markmap-node.is-mm-selected')
    .forEach((g) => g.classList.remove('is-mm-selected'));
  if (!mmSelectedId) return;
  mmEl.stage.querySelectorAll(
    `g.markmap-node[data-mm-id="${CSS.escape(mmSelectedId)}"]`)
    .forEach((g) => g.classList.add('is-mm-selected'));
}
function mmSelect(id) {
  mmSelectedId = id;
  mmEls.forEach((el, i) => el.classList.toggle('is-selected', i === id));
  syncMmSelectionClasses();
  /* 选中同步到大纲的 is-current：大纲是唯一数据源，选中态不该两边各记一份
     （以前只在「切回大纲视图」那一刻才对齐，导图里点一下大纲是看不到的）。 */
  document.querySelectorAll('#outline .topic.is-current').forEach((t) => t.classList.remove('is-current'));
  if (id && id !== MM_ROOT_ID) {
    const li = document.querySelector(`#outline li[data-id="${CSS.escape(id)}"]`);
    if (li) li.classList.add('is-current');
  }
  /* markmap 模式：把「+」入口 FAB 摆到选中节点的右上角 */
  mmPositionFab();
}

/* markmap 模式：把 FAB 摆在选中节点右侧偏上，markmap 重排 / 视图平移缩放后
 * 都要重算一次位置。FAB 是 body 直属 fixed 定位，要按选中节点的视口 bbox 算。
 *
 * 内置引擎也复用同一个 FAB：.mm-nodes 里的节点 absolute 定位，
 * 用 mmEls.get(id) 拿到 DOM，按 getBoundingClientRect 拿 bbox 即可。 */
function mmPositionFab() {
  const fab = document.getElementById('mm-fab');
  if (!fab) return;
  if (!mmActive || !mmSelectedId || mmSelectedId === MM_ROOT_ID || mmEditingId) {
    fab.hidden = true;
    return;
  }
  let rect;
  if (mmMkIsActive()) {
    const fo = document.querySelector(
      `#mm-mk-stage g.markmap-node[data-mm-id="${CSS.escape(mmSelectedId)}"] foreignObject`);
    if (!fo) { fab.hidden = true; return; }
    rect = fo.getBoundingClientRect();
  } else {
    const el = mmEls.get(mmSelectedId);
    if (!el) { fab.hidden = true; return; }
    rect = el.getBoundingClientRect();
  }
  if (rect.width === 0 && rect.height === 0) { fab.hidden = true; return; }
  /* 节点被自动 fit 切到画外时也别硬贴 */
  if (rect.right < 0 || rect.left > window.innerWidth || rect.bottom < 0 || rect.top > window.innerHeight) {
    fab.hidden = true; return;
  }
  fab.hidden = false;
  /* 节点右上角上方 6px 处居中；transform 已是 translate(-50%, -100%) */
  fab.style.left = (rect.right - 8) + 'px';
  fab.style.top = (rect.top - 6) + 'px';
}
function mmToggleFold(id) {
  const li = document.querySelector(`#outline li[data-id="${CSS.escape(id)}"]`);
  if (!li) return;                /* 虚拟根不在大纲 → 无折叠语义 */
  toggleTopic(li);                /* 复用大纲状态机（单一数据源），内部已通知导图重排 */
}
function mmAfterToggle() { if (mmActive) mmRelayout(true); }

/* 实时连接预览线 —— 从源节点中心到鼠标位置画一条贝塞尔曲线，
 * 颜色 / 样式按 drop 模式（child / sibling / none）切换。
 * SVG 是 body 直属 fixed 定位，line 画在 path 元素上。
 * 用 cubic 控制点让线条朝"源 → 鼠标"方向优雅弯过去。 */
function mmUpdateDragLine({ sx, sy, ex, ey, mode }) {
  const svg = document.getElementById('mm-drag-line');
  const path = document.getElementById('mm-drag-line-path');
  if (!svg || !path) return;
  svg.style.display = 'block';   /* 同 mmHideDragLine：必须用 display 不用 hidden */
  svg.classList.toggle('is-child', mode === 'child');
  svg.classList.toggle('is-sibling', mode === 'sibling');
  svg.classList.toggle('is-none', mode === 'none' || !mode);
  /* 立方贝塞尔：控制点放在两端中部 → 形成"先沿源方向走一段，再折向鼠标"的 S 形。
   * 水平方向偏移越大越"流"，所以 dx * 0.5。 */
  const dx = ex - sx, dy = ey - sy;
  const cx1 = sx + dx * 0.4, cy1 = sy;
  const cx2 = ex - dx * 0.4, cy2 = ey;
  path.setAttribute('d', `M ${sx} ${sy} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${ex} ${ey}`);
  /* 末端圆点：额外加一个 circle 标记"落点" */
  let dot = svg.querySelector('.mm-drag-line-circle');
  if (!dot) {
    dot = document.createElementNS(MM_SVG_NS, 'circle');
    dot.setAttribute('class', 'mm-drag-line-circle');
    dot.setAttribute('r', '4');
    svg.appendChild(dot);
  }
  dot.setAttribute('cx', ex);
  dot.setAttribute('cy', ey);
}
function mmHideDragLine() {
  const svg = document.getElementById('mm-drag-line');
  /* ⚠️ 必须用 display:none，不能用 hidden 属性：
   * .mm-drag-line 有 `position:fixed; inset:0;` 让浏览器把 svg 算成 display:block，
   * 于是 [hidden] { display:none } 这条 UA 默认被压住，hidden=true 仍然显示。
   * 结果：drag 结束后残留 path 一直挂在画布上，就是用户看到的那条粗蓝线。
   * inline style 同选择器优先级最高，直接盖掉。 */
  if (svg) svg.style.display = 'none';
}

/* markmap 抓手：跟 hover / 选中的节点走，位置由 mmMkPositionGrip 重算。
 * 抓手 mousedown 直接进入拖拽判定（不走 5px 阈值——抓手点中=明确想拖）。 */
const mmMkGripEl = document.getElementById('mm-mk-grip');
let mmMkGripId = null;
function mmMkPositionGrip() {
  if (!mmMkGripEl) return;
  if (!mmMkIsActive() || !mmActive) { mmMkGripEl.hidden = true; return; }
  /* 优先用 hover 节点，没有就退回选中节点（已选节点不显抓手 = 用户改完结构会看 toast 反馈） */
  const id = (mmMk && mmMk.hover && mmMk.hover.getAttribute('data-mm-id'))
          || mmSelectedId;
  if (!id || id === MM_ROOT_ID) { mmMkGripEl.hidden = true; return; }
  const fo = document.querySelector(
    `#mm-mk-stage g.markmap-node[data-mm-id="${CSS.escape(id)}"] foreignObject`);
  if (!fo) { mmMkGripEl.hidden = true; return; }
  const r = fo.getBoundingClientRect();
  if (!r.width && !r.height) { mmMkGripEl.hidden = true; return; }
  /* 抓在节点右上角偏外一点（margin: -9 让中心对齐到 r.right / r.top） */
  mmMkGripEl.hidden = false;
  mmMkGripEl.style.left = r.right + 'px';
  mmMkGripEl.style.top  = r.top + 'px';
  if (mmMkGripId !== id) {
    mmMkGripId = id;
    mmMkGripEl.dataset.mmId = id;
  }
  mmMkGripEl.classList.toggle('is-visible', !!mmMk.hover || id === mmSelectedId);
}
mmMkGripEl && mmMkGripEl.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  const id = mmMkGripEl.dataset.mmId;
  if (!id || id === MM_ROOT_ID) return;
  if (mmEditingId) return;
  e.preventDefault();
  e.stopPropagation();
  /* 先选中（视觉态同步），再启动拖拽（直接走、不等 5px 阈值） */
  mmSelect(id);
  mmMkDragStart(e, id);
  /* mmMkDragStart 注册的是 window 级 mousemove/up，但内部会用 d.moved=false 起手；
   * 我们已经在抓手上 mousedown 了，下一次 mousemove 必然超阈值 —— 把 d.moved 提前置位
   * 让 ghost / bar 立刻显出来。 */
  if (mmMkDrag) mmMkDrag.moved = true;
});

/* ----- 编辑：dblclick / Enter 进入；Enter 提交、Esc 取消、blur 提交 ----- */
function mmEditKeydown(e) {
  /* ⚠️ IME 组合期（中文候选中）全部按键放行给输入法：
     否则按 Enter 选候选词会被当成"提交"，直接关掉编辑 —— 中文输入必坏 */
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); mmCommitEdit(); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); mmCommitEdit(true); }
  else if (e.key === 'Tab') {
    /* 编辑中 Tab = 提交并新建子级（与非编辑态 Tab 语义一致）；Shift+Tab = 提交并提级 */
    e.preventDefault(); e.stopPropagation();
    const id = mmEditingId;
    mmCommitEdit();
    if (id && mmModelOf(id)) {
      mmSelect(id);
      if (e.shiftKey) mmOutdent(); else mmInsertChild();
    }
  }
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    /* 编辑态下只有空文本才把整节点删掉（幕布 / XMind 的习惯）；
       有内容时放行给原生，让它正常删字。document keydown 在 mmEditingId
       非空时直接 return 不会删树，所以必须在这里接。
       还要 stopPropagation：mmCommitEdit 会顺带把光标选到兄弟节点上，
       不挡的话 document handler 会跟着把这个兄弟也删了。 */
    const t = e.target;
    if (t && !t.textContent.trim()) {
      e.preventDefault();
      e.stopPropagation();
      mmCommitEdit();   /* 空内容会顺带把刚建的空节点清掉（empty-cleanup），刚好等于删除 */
    }
  }
}
function mmEditBlur() { mmCommitEdit(); }
/* 编辑输入 → rAF 节流实时重排：节点宽度跟着打字生长，不等提交才跳（丝滑关键） */
let mmEditRaf = null;
function mmEditInput() {
  /* markmap 模式别主动重排：它内部有 ResizeObserver 盯着节点的
     scrollWidth，文字一变宽就会自己重算；这里再 setData 一次纯属浪费，
     还会把「适应」重算一遍，编辑时视角跟着抖。 */
  if (mmMkIsActive()) return;
  if (mmEditRaf) cancelAnimationFrame(mmEditRaf);
  mmEditRaf = requestAnimationFrame(() => {
    mmEditRaf = null;
    if (mmEditingId) mmRelayout(false);
  });
}
/* 可编辑元素：内置引擎是 .mm-node 里的 .mm-text，
   markmap 是 foreignObject 里那两层 div 的内层（双击走的就是它）。
   抽出来是为了让 F2 / Enter / Tab / 双击四条入口共用同一套编辑生命周期。 */
function mmEditBox(id) {
  if (!id || id === MM_ROOT_ID) return null;
  if (mmMkIsActive()) {
    return document.querySelector(
      `#mm-mk-stage g.markmap-node[data-mm-id="${CSS.escape(id)}"] foreignObject > div > div`);
  }
  const el = mmEls.get(id);
  return el ? el.querySelector('.mm-text') : null;
}

function mmStartEdit(id, retry) {
  if (mmEditingId) mmCommitEdit();
  const t = mmEditBox(id);
  if (!t) {
    /* markmap 的节点是**异步**渲染出来的：Enter / Tab 刚把节点写进大纲，
       mmRelayout 只是把数据推给 markmap，真正的 <g> 要等下一次 renderData
       才出现。这里不放弃 —— 等它出来再进编辑态（上限约 0.7s）。 */
    if (!retry && mmMkIsActive()) {
      let tries = 0;
      const wait = () => {
        if (mmEditingId) return;
        tries += 1;
        if (mmEditBox(id)) mmStartEdit(id, true);
        else if (tries < 45) requestAnimationFrame(wait);
      };
      requestAnimationFrame(wait);
    }
    return;
  }
  mmEditingId = id;
  mmEditRestore = t.innerHTML;
  if (!mmMkIsActive()) t.closest('.mm-node').classList.add('is-editing');
  t.contentEditable = 'true';
  t.focus();
  const r = document.createRange();
  r.selectNodeContents(t);
  r.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
  t.addEventListener('keydown', mmEditKeydown);
  t.addEventListener('input', mmEditInput);
  t.addEventListener('blur', mmEditBlur);
}
function mmCommitEdit(cancel = false) {
  const id = mmEditingId;
  if (!id) return;
  mmEditingId = null;
  let cleanupFocus;                     /* 空节点清理后的新选中 id */
  const t = mmEditBox(id);
  if (t) {
    t.removeEventListener('keydown', mmEditKeydown);
    t.removeEventListener('input', mmEditInput);
    t.removeEventListener('blur', mmEditBlur);
    const el = mmMkIsActive() ? null : t.closest('.mm-node');
    if (el) el.classList.remove('is-editing');
    t.contentEditable = 'false';
    if (cancel) {
      t.innerHTML = mmEditRestore;
    } else {
      /* 写回大纲（单一数据源）：innerHTML 保留行内格式（mark/b/code…） */
      const li = document.querySelector(`#outline li[data-id="${CSS.escape(id)}"]`);
      const content = li && li.querySelector(':scope > .topic-row > .topic-content');
      if (content) content.innerHTML = t.innerHTML;
      /* 空节点清理：新建节点没输入任何内容就回车 → 直接移除（mubu 行为，
         避免导图上留空壳）。仅当"编辑前就是空 && 编辑后仍为空 && 无子级"。 */
      const wasEmpty = !mmEditRestore.replace(/<br\s*\/?>/gi, '').trim();
      if (li && wasEmpty && !t.textContent.trim() && !li.querySelector('.topic-children')) {
        const parentUl = li.parentElement;
        cleanupFocus = (li.nextElementSibling || li.previousElementSibling)?.dataset?.id
          || (parentUl && parentUl.parentElement ? parentUl.parentElement.dataset.id : null)
          || null;
        li.remove();
        mmCleanupEmptyParent(parentUl);
      }
    }
  }
  mmRelayout(false);              /* 文本长度可能变化 → 重新测量布局 */
  if (cleanupFocus !== undefined) {
    mmSelect(cleanupFocus && mmModelOf(cleanupFocus) ? cleanupFocus : null);
  }
}

/* ----- 视图变换：pan / zoom / fit ----- */
/* 两套引擎挂在各自的舞台上，但**共用同一个 mmView**：
   内置引擎推 .mm-canvas，markmap 推 .mm-mk-stage（里面是左右两个 svg）。
   同时写两处最省事 —— 互斥显示保证看不见的那套根本不渲染。 */
function mmApplyView() {
  const t = `translate(${mmView.tx}px, ${mmView.ty}px) scale(${mmView.s})`;
  mmEl.canvas.style.transform = t;
  if (mmEl.stage) mmEl.stage.style.transform = t;
  mmEl.pct.textContent = Math.round(mmView.s * 100) + '%';
  /* 平移缩放后 markmap 节点的屏幕位置变了，FAB 要跟上 */
  mmPositionFab();
  mmMkPositionGrip();
}
function mmZoomAt(cx, cy, factor) {
  const s0 = mmView.s;
  const s = Math.min(3, Math.max(0.15, s0 * factor));
  if (s === s0) return;
  mmView.tx = cx - (cx - mmView.tx) * (s / s0);
  mmView.ty = cy - (cy - mmView.ty) * (s / s0);
  mmView.s = s;
  mmApplyView();
}
/* fit 的最小缩放下限。
   思维导图是「深度分列」的：一份 5 层、二十多个节点的文档天然就有四五千像素宽，
   硬塞进视口会缩到 20% 出头 —— 字全糊成马赛克，等于什么都看不见。
   幕布 / XMind 的做法是**锁一个可读的缩放、视图锚在中心主题**，
   让用户自己往外拖，而不是为了"全览"牺牲可读性。 */
const MM_MIN_FIT_S = 0.5;
function mmFit() {
  const pad = 80;
  const W = window.innerWidth, H = window.innerHeight;
  /* markmap 的包围盒由左右两棵树合出来的（mmMkPlace 会写进 mmLayoutSize），
     直接问它要中心点；内置引擎的布局是左上原点，中心就是 w/2, h/2。 */
  const b = mmMkIsActive() ? mmMkBounds() : null;
  const box = b
    ? { w: b.x2 - b.x1, h: b.y2 - b.y1, cx: (b.x1 + b.x2) / 2, cy: (b.y1 + b.y2) / 2 }
    : { w: mmLayoutSize.w, h: mmLayoutSize.h, cx: mmLayoutSize.w / 2, cy: mmLayoutSize.h / 2 };
  const { w, h } = box;
  if (!w || !h) return;
  const s = Math.max(MM_MIN_FIT_S, Math.min((W - pad * 2) / w, (H - pad * 2) / h, 1));
  mmView.s = s;
  const fits = w * s <= W - pad * 2 && h * s <= H - pad * 2;
  /* 锚点选择：
     · 装得下 → 居中整张图，两边留白均匀；
     · 装不下 → 思维导图锚中心主题（根就是视觉枢纽，进来第一眼看它）：
         markmap 下 mmMkPlace 已把中心主题摆在 stage 原点，锚点就是 (0,0)；
         内置引擎下根有真实坐标，取根盒中心。
       逻辑图/括号图的根贴在最左边，锚根会让右半屏全空，所以退回居中包围盒。 */
  let cx = box.cx, cy = box.cy;
  if (!fits && mmLayout.key === 'mindmap') {
    if (mmMkIsActive()) { cx = 0; cy = 0; }
    else {
      const root = mmModel.get(MM_ROOT_ID);
      if (root) { cx = root.x + root.w / 2; cy = root.y + root.h / 2; }
    }
  }
  mmView.tx = W / 2 - cx * s;
  mmView.ty = H / 2 - cy * s;
  mmApplyView();
}
/* 重排后的自动跟随。
   刻意只在「内容真的装不下、且当前缩放还没触到下限」时才动视角：
   编辑时每敲一个字包围盒都在长，无条件 fit 会让画布跟着抖，
   用户根本没法看着自己正在编辑的那个节点。 */
function mmAutoFit() {
  if (mmViewUserMoved) return;
  const { w, h } = mmLayoutSize;
  if (!w || !h) return;
  const W = window.innerWidth, H = window.innerHeight, pad = 80;
  if (w * mmView.s <= W - pad * 2 && h * mmView.s <= H - pad * 2) return;   /* 完整可见 → 别动 */
  if (mmView.s <= MM_MIN_FIT_S + 0.001) return;   /* 已在下限，本来就装不下，别反复拉 */
  mmFit();
  /* fit 后选中节点的屏幕位置变了 —— FAB 跟一下 */
  mmPositionFab();
}

mmEl.root.addEventListener('wheel', (e) => {
  e.preventDefault();
  mmViewUserMoved = true;                 /* 用户动过视角，之后不再自动 fit */
  if (e.ctrlKey || e.metaKey) {
    mmZoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));  /* 捏合 / Ctrl+滚轮：定点缩放 */
  } else {
    mmView.tx -= e.deltaX;                                        /* 滚轮 / 触摸板：平移 */
    mmView.ty -= e.deltaY;
    mmApplyView();
  }
}, { passive: false });

mmEl.root.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  if (e.target.closest('.mm-controls, .mm-theme-pop, .mm-layout-pop')) return;  /* 控件/弹层上不启动平移 */
  /* 节点自己有拖动逻辑（内置引擎 mmNodeDragStart / markmap 节点选中），这里不抢 */
  if (e.target.closest('.mm-node')) return;
  if (mmMkIsActive() && e.target.closest('g.markmap-node')) return;
  mmThemePop.hidden = true;                                               /* 点画布空白 → 收起弹层 */
  mmLayoutPop.hidden = true;
  const start = { x: e.clientX, y: e.clientY, tx: mmView.tx, ty: mmView.ty };
  let moved = 0;
  mmEl.root.classList.add('is-panning');
  const onMove = (ev) => {
    moved = Math.max(moved, Math.abs(ev.clientX - start.x) + Math.abs(ev.clientY - start.y));
    if (moved >= 4) mmViewUserMoved = true;
    mmView.tx = start.tx + (ev.clientX - start.x);
    mmView.ty = start.ty + (ev.clientY - start.y);
    mmApplyView();
  };
  const onUp = () => {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    mmEl.root.classList.remove('is-panning');
    if (moved < 4) {                       /* 视为点击空白：结束编辑 + 取消选中 */
      if (mmEditingId) mmCommitEdit();
      mmSelect(null);
    }
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
});

/* 手动缩放 = 用户接管了视角，之后不再自动跟随 */
document.getElementById('mm-zoom-in').addEventListener('click', () => {
  mmViewUserMoved = true;
  mmZoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.25);
});
document.getElementById('mm-zoom-out').addEventListener('click', () => {
  mmViewUserMoved = true;
  mmZoomAt(window.innerWidth / 2, window.innerHeight / 2, 1 / 1.25);
});
document.getElementById('mm-zoom-pct').addEventListener('click', () => {
  mmViewUserMoved = true;
  mmZoomAt(window.innerWidth / 2, window.innerHeight / 2, 1 / mmView.s);
});
document.getElementById('mm-fit').addEventListener('click', () => { mmViewUserMoved = false; mmFit(); });
/* 整理布局：丢掉全部手动偏移，回到自动 tidy tree 结果 */
document.getElementById('mm-tidy').addEventListener('click', () => {
  mmViewUserMoved = false;
  if (!mmDrags.size) { mmFit(); return; }
  mmDrags.clear();
  mmRelayout(false);
  mmFit();
});

/* ============================================================
 * 展示主题选择器（🎨 按钮 → 弹层；点击即切换 + localStorage 持久化）
 * ============================================================ */
const mmThemePop = document.getElementById('mm-theme-pop');
MM_THEMES.forEach((t) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'mm-theme-item';
  b.dataset.theme = t.key;
  const dots = [t.center, t.palette[0], t.palette[2] || t.palette[1] || t.palette[0]];
  b.innerHTML = `<span class="mm-theme-swatch" style="background:linear-gradient(135deg, ${dots.join(', ')})"></span>`
    + `<span>${t.name}</span><span class="tick">✓</span>`;
  b.addEventListener('click', () => { mmApplyTheme(t.key); mmThemePop.hidden = true; });
  mmThemePop.appendChild(b);
});
function mmApplyTheme(key) {
  const t = MM_THEMES.find((x) => x.key === key) || MM_THEMES[0];
  mmTheme = t;
  try { localStorage.setItem('mm-theme', t.key); } catch (e) { /* ignore */ }
  document.querySelectorAll('.mm-theme-item')
    .forEach((el) => el.classList.toggle('is-active', el.dataset.theme === t.key));
  if (mmActive) {
    document.body.dataset.mmTheme = t.key;   /* CSS token 覆盖生效 */
    mmRelayout(false);                       /* 重建模型 → 新 palette 流入 --branch / 连线 */
  }
}
document.getElementById('mm-theme-btn').addEventListener('click', () => {
  mmThemePop.hidden = !mmThemePop.hidden;
  mmLayoutPop.hidden = true;             /* 两个弹层互斥 */
});
mmApplyTheme(mmTheme.key);   /* 初始同步弹层 ✓ 标记（含 localStorage 恢复的主题） */
/* 控件 / 弹层按钮点完即 blur：防止焦点留在 button 上时
   Enter / Space 既触发按钮又撞上 mm 快捷键（Enter=新建同级） */
document.getElementById('mm-controls').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) b.blur();
});
mmThemePop.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) b.blur();
});

/* ============================================================
 * 导图结构选择器（☰ 按钮 → 弹层；思维导图 / 逻辑图 / 括号图）
 * 切换 = 换 mmComputeLayout 的算法 + 换 mmDrawLinks 的画法，
 * 数据源（大纲 DOM）与折叠/编辑状态机完全不变 → 即时生效、无需重建
 * ============================================================ */
const mmLayoutPop = document.getElementById('mm-layout-pop');
/* 缩略图 = 3 个节点方块 + 若干连线，用 <i>/<s> 拼（数量按结构定） */
const MM_LAYOUT_ICONS = {
  mindmap: [3, 4],   /* 3 节点 / 4 连线 */
};
/* 2026-10-12：内置引擎（逻辑图 / 括号图）砍掉，layout popover 只渲染当前唯一结构。
 * 留 MM_LAYOUTS + MM_LAYOUT_ICONS 是为了不破坏 mmSyncLayoutUI / data-mm-layout
 * 这些跟"身体属性"耦合的契约，将来真要扩多 mark 时不必重写外壳。 */
MM_LAYOUTS.forEach((l) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'mm-theme-item mm-layout-item';
  b.dataset.layout = l.key;
  b.title = l.hint;
  const [n, s] = MM_LAYOUT_ICONS[l.key];
  b.innerHTML = `<span class="mm-layout-ico mm-ico-${l.key}">`
    + '<i></i>'.repeat(n) + '<s></s>'.repeat(s) + '</span>'
    + `<span>${l.name}</span><span class="tick">✓</span>`;
  b.addEventListener('click', () => { mmApplyLayout(l.key); mmLayoutPop.hidden = true; });
  mmLayoutPop.appendChild(b);
});
function mmApplyLayout(key) {
  /* 2026-10-12：内置引擎砍掉后，MM_LAYOUTS 只剩 mindmap。
   * 即便老用户 localStorage 里残留 'logic' / 'bracket'，也只强制回 mindmap —— 不重排（结构没变）。 */
  if (key !== 'mindmap') {
    try { localStorage.setItem('mm-layout', 'mindmap'); } catch (e) { /* ignore */ }
    mmSyncLayoutUI();
    return;
  }
  const l = MM_LAYOUTS.find((x) => x.key === key);
  if (!l || l.key === mmLayout.key) { mmSyncLayoutUI(); return; }
  mmLayout = l;
  try { localStorage.setItem('mm-layout', l.key); } catch (e) { /* ignore */ }
  mmSyncLayoutUI();
  if (mmActive) {
    document.body.dataset.mmLayout = l.key;
    /* 换结构 → 左右归属全变（原来在左的跑到右边去了），旧的拖动偏移已无意义，
       必须清空，否则会出现"叠在新结构上"的诡异错位。 */
    mmDrags.clear();
    /* 换结构后旧坐标全部失效 → 不做逐点动画，直接落位再 fit（避免整树乱飞） */
    mmRelayout(false);
    mmFit();
  }
}
function mmSyncLayoutUI() {
  mmLayoutPop.querySelectorAll('.mm-layout-item')
    .forEach((el) => el.classList.toggle('is-active', el.dataset.layout === mmLayout.key));
}
document.getElementById('mm-layout-btn').addEventListener('click', () => {
  mmLayoutPop.hidden = !mmLayoutPop.hidden;
  mmThemePop.hidden = true;              /* 两个弹层互斥 */
});
mmLayoutPop.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) b.blur();
});
mmSyncLayoutUI();

/* markmap 选中节点右上角 FAB：「+ 子级 / + 同级 / 删」三件套
 * —— 键盘党有快捷键，鼠标 / 触屏党有 FAB。点完按钮顺手把焦点抢回
 * 选中节点（用 mmSelect 重写 mmSelectedId）让键盘 / 拖拽继续从这走。 */
document.getElementById('mm-fab').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b || !mmSelectedId) return;
  /* 失焦后下一帧 mmEditBox 才能正确拿到刚生成的 markmap 节点，
   * 否则 commit 时 onblur 早跑了。保险起见藏一下 FAB。 */
  document.getElementById('mm-fab').hidden = true;
  if (b.dataset.act === 'child')        mmInsertChild();
  else if (b.dataset.act === 'sibling') mmInsertSibling();
  else if (b.dataset.act === 'delete')  mmDeleteSelected();
});

/* ============================================================
 * mm 模式快捷键（对齐 mubu）
 *   ↑ / ↓            按可见顺序（DFS 前序）前后选择
 *   ← / →            父级 / 首个子级（折叠态 → 原地展开，选中不动）
 *   Tab / Shift+Tab  新建子级并进编辑 / 提级（幕布语义）
 *   Alt+← / Alt+→    提级 / 降级（缩进）—— 复用大纲逻辑
 *   Enter            新建同级并进入编辑（中心主题上 = 追加一级分支）
 *   F2 / 双击        编辑选中节点            Esc 取消选中
 *   Delete/Backspace 删除节点 —— 子级原地晋升一级（不丢数据；
 *                    整棵子树移除用 ⌘/Ctrl+X 剪切，仍可粘回）
 *   Ctrl/⌘ + C/X/V   复制 / 剪切 / 粘贴子树（粘贴重发 id，可多次）
 *   Ctrl+. 折叠系列由全局 handler 负责，mm 模式同样生效
 * ============================================================ */
function mmLi(id) {
  if (!id || id === MM_ROOT_ID) return null;
  return document.querySelector(`#outline li[data-id="${CSS.escape(id)}"]`);
}
function mmNewId() { return 'new-' + Math.random().toString(36).slice(2, 8); }

/* li 移除后：空 children 容器删掉、父级退回叶子（无 data-state） */
function mmCleanupEmptyParent(parentUl) {
  if (!parentUl || !parentUl.classList.contains('topic-children')) return;
  if (parentUl.children.length > 0) return;
  const grand = parentUl.parentElement;
  parentUl.remove();
  if (grand && grand.classList.contains('topic') && !grand.querySelector(':scope > .topic-children')) {
    delete grand.dataset.state;
  }
}

/* 平移画布让节点回到视口内（方向键导航自动跟随） */
function mmEnsureVisible(id) {
  /* markmap 的坐标不在模型里（d3 算的），直接量 DOM 矩形 */
  if (mmMkIsActive()) { mmMkScrollIntoView(id); return; }
  const m = mmModel.get(id);
  if (!m) return;
  const pad = 60;
  const W = window.innerWidth || 1280, H = window.innerHeight || 800;
  const sx = m.x * mmView.s + mmView.tx;
  const sy = m.y * mmView.s + mmView.ty;
  const sw = m.w * mmView.s, sh = m.h * mmView.s;
  let dx = 0, dy = 0;
  if (sx < pad) dx = pad - sx;
  else if (sx + sw > W - pad) dx = (W - pad) - (sx + sw);
  if (sy < pad) dy = pad - sy;
  else if (sy + sh > H - pad) dy = (H - pad) - (sy + sh);
  if (dx || dy) { mmView.tx += dx; mmView.ty += dy; mmApplyView(); }
}

function mmMove(delta) {
  const src = mmMkIsActive() ? mmTree : mmModel;
  const ids = Array.from(src.keys());   /* 插入序 = DFS 前序 = 视觉自上而下 */
  if (!ids.length) return;
  let idx = mmSelectedId ? ids.indexOf(mmSelectedId) : -1;
  idx = idx === -1 ? (delta > 0 ? 0 : ids.length - 1) : idx + delta;
  idx = Math.max(0, Math.min(ids.length - 1, idx));
  mmSelect(ids[idx]);
  mmEnsureVisible(ids[idx]);
}
function mmMoveToEdge(first) {
  const src = mmMkIsActive() ? mmTree : mmModel;
  const ids = Array.from(src.keys());
  if (!ids.length) return;
  const id = first ? ids[0] : ids[ids.length - 1];
  mmSelect(id);
  mmEnsureVisible(id);
}
function mmGoParent() {
  const m = mmModelOf(mmSelectedId);
  if (!m || !m.parentId) return;
  mmSelect(m.parentId);
  mmEnsureVisible(m.parentId);
}
function mmGoChild() {
  const m = mmModelOf(mmSelectedId);
  if (!m) return;
  if (m.folded && m.hasChildren) { mmToggleFold(m.id); return; }   /* → 折叠时先展开 */
  if (m.childIds.length) { mmSelect(m.childIds[0]); mmEnsureVisible(m.childIds[0]); }
}

/* Enter = 新建同级并立即进入编辑（幕布语义）；中心主题 = 追加一级分支 */
function mmInsertSibling() {
  mmHistoryPush();
  const newId = mmNewId();
  const li = mmLi(mmSelectedId);
  const newLi = buildTopic({ id: newId, heading: 0, text: '' },
                           li ? (parseInt(li.dataset.depth, 10) || 0) : 0);
  if (li) li.after(newLi);
  else document.getElementById('outline').appendChild(newLi);   /* 中心主题 → 追加一级分支 */
  mmRelayout(true);   /* 新节点从兄弟位置飞出就位 */
  mmSelect(newId);
  mmEnsureVisible(newId);
  mmStartEdit(newId);
}

/* Tab = 新建子主题并立即进入编辑（幕布语义）。
   已有子级 → 追加为最后一个子级；折叠的父节点自动展开；叶子自动晋升为父节点。
   中心主题 / 无选中 → 退化为新建一级分支。 */
function mmInsertChild() {
  const m = mmModelOf(mmSelectedId);
  if (!m || mmSelectedId === MM_ROOT_ID) { mmInsertSibling(); return; }
  mmHistoryPush();
  const li = mmLi(mmSelectedId);
  if (!li) return;
  const depth = parseInt(li.dataset.depth, 10) || 0;
  let ul = li.querySelector(':scope > .topic-children');
  if (!ul) {
    ul = document.createElement('ul');
    ul.className = 'topic-children';
    li.appendChild(ul);
  }
  const newId = mmNewId();
  const newLi = buildTopic({ id: newId, heading: 0, text: '' }, depth + 1);
  ul.appendChild(newLi);
  li.dataset.state = 'open';   /* 折叠中则自动展开 */
  mmRelayout(true);
  mmSelect(newId);
  mmEnsureVisible(newId);
  mmStartEdit(newId);
}

function mmIndent() {
  const li = mmLi(mmSelectedId);
  if (!li) return;
  mmHistoryPush();
  indentTopic(li);
  mmRelayout(true);
  mmEnsureVisible(mmSelectedId);
}
function mmOutdent() {
  const li = mmLi(mmSelectedId);
  if (!li) return;
  mmHistoryPush();
  outdentTopic(li);
  mmRelayout(true);
  mmEnsureVisible(mmSelectedId);
}

/* Delete：移除节点本体，子级原地晋升（整树删除走 ⌘X） */
function mmDeleteSelected() {
  const li = mmLi(mmSelectedId);
  if (!li) return;
  mmHistoryPush();
  const parentUl = li.parentElement;
  const depth = parseInt(li.dataset.depth, 10) || 0;
  const kidsUl = li.querySelector(':scope > .topic-children');
  let firstKidId = null;
  if (kidsUl) {
    const kids = Array.from(kidsUl.children);
    kids.forEach((k) => { li.before(k); updateDepth(k, depth); });
    firstKidId = kids.length ? kids[0].dataset.id : null;
  }
  const nextId = li.nextElementSibling ? li.nextElementSibling.dataset.id : null;
  const prevId = li.previousElementSibling ? li.previousElementSibling.dataset.id : null;
  li.remove();
  mmCleanupEmptyParent(parentUl);
  mmRelayout(true);
  const focusId = firstKidId || nextId || prevId
    || (parentUl && parentUl.parentElement ? parentUl.parentElement.dataset.id : null);
  mmSelect(focusId && mmModelOf(focusId) ? focusId : null);
  if (focusId) mmEnsureVisible(focusId);
}

/* ----- 子树剪贴板（内存级）：粘贴时重发 id，可重复粘贴 ----- */
let mmClip = null;
function mmReassignIds(li) {
  li.dataset.id = mmNewId();
  li.querySelectorAll('[data-id]').forEach((el) => { el.dataset.id = mmNewId(); });
  return li;
}
function mmCopySelected(cut) {
  const li = mmLi(mmSelectedId);
  if (!li) return;
  mmClip = li.cloneNode(true);
  mmClip.classList.remove('is-current', 'drill-down');
  mmClip.querySelectorAll('.is-current, .drill-down')
    .forEach((el) => el.classList.remove('is-current', 'drill-down'));
  if (!cut) return;
  const parentUl = li.parentElement;
  const focusId = (li.nextElementSibling || li.previousElementSibling)?.dataset?.id
    || (parentUl && parentUl.parentElement ? parentUl.parentElement.dataset.id : null) || null;
  li.remove();
  mmCleanupEmptyParent(parentUl);
  mmRelayout(true);
  mmSelect(focusId && mmModelOf(focusId) ? focusId : null);
}
function mmPaste() {
  if (!mmClip) return;
  const li = mmLi(mmSelectedId);
  if (!li) return;
  const clone = mmReassignIds(mmClip.cloneNode(true));
  updateDepth(clone, parseInt(li.dataset.depth, 10) || 0);
  li.after(clone);
  mmRelayout(true);
  mmSelect(clone.dataset.id);
  mmEnsureVisible(clone.dataset.id);
}

document.addEventListener('keydown', (e) => {
  if (!mmActive || mmEditingId) return;   /* 编辑中归 mmEditKeydown（Enter/Esc/Tab）管 */

  if (e.metaKey || e.ctrlKey) {
    if (e.altKey) return;                  /* Ctrl+Alt 系列归全局折叠 handler */
    const k = e.key.toLowerCase();
    if (e.shiftKey && k === 'z') {        /* ⌘⇧Z = 重做 */
      e.preventDefault();
      if (mmHistoryRedo()) mmToast('已重做');
      else mmToast('已经是最新的了', { duration: 1500 });
      return;
    }
    if (k === 'c') { e.preventDefault(); mmCopySelected(false); }
    else if (k === 'x') { e.preventDefault(); mmCopySelected(true); }
    else if (k === 'v') { e.preventDefault(); mmPaste(); }
    else if (k === 'z') {                 /* ⌘Z = 撤销 */
      e.preventDefault();
      if (mmHistoryUndo()) mmToast('已撤销上一步');
      else mmToast('已经是最早的一步了', { duration: 1500 });
    }
    return;
  }
  /* Alt+←/→ = 提级/降级（幕布）；其余 Alt 组合（Ctrl+Alt+1/2/3 等）归全局 handler */
  if (e.altKey) {
    if (e.key === 'ArrowLeft')  { e.preventDefault(); mmOutdent(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); mmIndent(); }
    return;
  }

  switch (e.key) {
    case 'ArrowUp':    e.preventDefault(); mmMove(-1); break;
    case 'ArrowDown':  e.preventDefault(); mmMove(1); break;
    case 'ArrowLeft':  e.preventDefault(); mmGoParent(); break;
    case 'ArrowRight': e.preventDefault(); mmGoChild(); break;
    case 'Tab':        e.preventDefault(); if (e.shiftKey) mmOutdent(); else mmInsertChild(); break;  /* Tab=新建子级（幕布）；缩进用 Alt+→ */
    case 'Enter':      e.preventDefault(); mmInsertSibling(); break;
    case 'F2':         e.preventDefault();
      if (mmSelectedId && mmSelectedId !== MM_ROOT_ID) mmStartEdit(mmSelectedId);
      break;
    case 'Delete':
    case 'Backspace':  e.preventDefault(); mmDeleteSelected(); break;
    case 'Home':       e.preventDefault(); mmMoveToEdge(true); break;
    case 'End':        e.preventDefault(); mmMoveToEdge(false); break;
    case 'Escape':     if (mmSelectedId) mmSelect(null); break;
  }
});

/* ----- 视图切换 ----- */
function mmSetSwitchUI(v) {
  document.querySelectorAll('#view-switch button').forEach((b) => {
    const on = b.dataset.view === v;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', String(on));
  });
}
function setView(v) {
  if (v === 'mindmap' && !mmActive) {
    mmActive = true;
    document.body.classList.add('mm-mode');
    document.body.dataset.mmTheme = mmTheme.key;   /* 主题 token 仅导图模式挂载 */
    document.body.dataset.mmLayout = mmLayout.key; /* 结构 token（折叠钮方位等） */
    mmEl.root.hidden = false;
    /* 首次进入导图模式时记一份"出厂"快照，撤销栈起点 */
    if (mmHistoryCursor === -1) {
      mmHistory.length = 0;
      mmHistory.push(mmSnapshotOutline());
      mmHistoryCursor = 0;
    }
    mmSetSwitchUI('mindmap');
    toolbar.hidden = true;                 /* 选区 toolbar 属于大纲模式 */
    mmThemePop.hidden = true;
    mmViewUserMoved = false;
    mmRelayout(false);
    mmFit();
  } else if (v === 'outline' && mmActive) {
    if (mmEditingId) mmCommitEdit();
    mmActive = false;
    document.body.classList.remove('mm-mode');
    delete document.body.dataset.mmTheme;  /* 大纲视图恒浅色 */
    delete document.body.dataset.mmLayout;
    mmThemePop.hidden = true;
    mmLayoutPop.hidden = true;
    mmEl.root.hidden = true;
    mmSetSwitchUI('outline');
    /* mm 里选中的节点映射回大纲 is-current（视图连续性），并滚到可见 */
    if (mmSelectedId && mmSelectedId !== MM_ROOT_ID) {
      const li = document.querySelector(`#outline li[data-id="${CSS.escape(mmSelectedId)}"]`);
      if (li) {
        document.querySelectorAll('.topic.is-current').forEach((t) => t.classList.remove('is-current'));
        li.classList.add('is-current');
        li.scrollIntoView({ block: 'nearest' });
      }
    }
  }
}
document.getElementById('view-switch').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-view]');
  if (btn) setView(btn.dataset.view);
});

/* ============================================================
 * 启动
 * ============================================================ */
render();

/* 深链：?view=mindmap&layout=mindmap&theme=dark
   除了方便分享，也让无头浏览器截图能直接落到指定状态（没法先点再拍）。 */
(function deepLink() {
  const q = new URLSearchParams(location.search);
  const layout = q.get('layout');
  if (layout) mmApplyLayout(layout);
  const theme = q.get('theme');
  if (theme) mmApplyTheme(theme);
  if (q.get('view') === 'mindmap') {
    setTimeout(() => setView('mindmap'), 0);
  }
})();
</script>

<!-- markmap：思维导图结构的布局/渲染引擎。
     走 jsDelivr 的 +esm 端点（依赖已被内联并 tree-shake），比 dist 的 UMD 小一个量级。
     加载完成后广播事件，主脚本那边负责创建实例 —— 主脚本是同步执行的，
     不能直接 import（那时模块还没到），所以用「事件 + 兜底轮询」握手。 -->
<script type="module">
const MK_VER = '0.18.12';
try {
  const [view, lib] = await Promise.all([
    import(`https://cdn.jsdelivr.net/npm/markmap-view@${MK_VER}/+esm`),
    import(`https://cdn.jsdelivr.net/npm/markmap-lib@${MK_VER}/+esm`),
  ]);
  window.MM_MK_API = { ...view, Transformer: lib.Transformer, builtInPlugins: lib.builtInPlugins };
} catch (e) {
  console.warn('[mm] markmap 加载失败，思维导图将退化为空白（逻辑图/括号图不受影响）', e);
  window.MM_MK_API = null;
}
window.dispatchEvent(new Event('mm-mk-ready'));
</script>
