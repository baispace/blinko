# 前后端分离部署：公开博客独立进程（app/blog-serve.ts）。
#
# 与同服务路径映射（deploy/blog.baispace.cn.conf）的区别：
#   - 那一份把域名指向主应用（1111），博客由主应用自己渲染；
#   - 这一份指向独立的博客进程（4175），它自己托管前端产物、服务端渲染首屏，
#     并把 /api 反向代理到主应用。
#
# 两种方案不要同时启用同一个域名：先切 nginx，再切流量。
#
# 用法：
#   1. 证书路径按实际替换；
#   2. 若博客进程跑在容器里，把 127.0.0.1 换成同网络的服务名。

server {
    listen 80;
    server_name blog.baispace.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://blog.baispace.cn$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name blog.baispace.cn;

    ssl_certificate /etc/letsencrypt/live/blog.baispace.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.baispace.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 首屏与页面：交给博客进程（它会做服务端渲染并带上缓存头）。
    location / {
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        # 博客进程自己会发缓存头，这里不要覆盖。
        proxy_buffering on;
    }

    # 带 hash 的静态资源：内容寻址，可以放心长缓存。
    location ~ ^/(assets|fonts|font-assets|icons|locales|brand)/ {
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 公开接口：由博客进程转发到主应用。限流与鉴权仍在主应用那边。
    location /api/ {
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
