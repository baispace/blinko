  <!--
    首屏占位与主题预置。

    React 与业务请求之前，浏览器只拿到这一个 HTML。这里做两件事：

    1. 主题：读取 next-themes 使用的同一个存储键（theme），在首帧之前把
       light / dark 写进 <html> 的 class。next-themes 自带的脚本要等 React
       挂载后才执行，深色用户会先看到一片白；这里提前一步，避免闪烁。
    2. 占位：样式与图标全部内联，不等待任何外部资源，页面一到达就有完整的
       品牌标识，而不是无样式文字或白屏。app-ready 标记由 main.tsx 在
       React 首次提交后添加。

    ⚠️ 下面的 path 数据必须与 src/components/Common/Brand/brandGeometry.ts
       保持一致，由 scripts/tests/brand-assets.test.ts 校验。
  -->
  <style>
    :root {
      color-scheme: light;
      --app-boot-bg: #ffffff;
      --app-boot-mark: #5f40fd;
      --app-boot-text: #101229;
    }

    html.dark {
      color-scheme: dark;
      --app-boot-bg: #000000;
      --app-boot-mark: #cabefc;
      --app-boot-text: #f5f5f7;
    }

    #app-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--app-boot-bg);
      color: var(--app-boot-text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    html.app-ready #app-boot {
      display: none;
    }

    /* 公开博客有自己的品牌与骨架屏：那里不出现产品标识。 */
    html.app-boot-off #app-boot,
    html.ink-blog-js #app-boot {
      display: none;
    }

    #app-boot svg {
      display: block;
      width: 52px;
      height: 82px;
    }

    #app-boot p {
      margin: 0;
      font-size: 13px;
      line-height: 1;
      color: var(--app-boot-mark);
      opacity: 0.75;
    }
  </style>
  <script id="app-boot-theme">
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var resolved = stored || 'system';
        if (resolved === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(resolved);
        root.style.colorScheme = resolved;
        var themeColor = resolved === 'dark' ? '#1c1c1e' : '#f8f8f8';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', themeColor);
        var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (bar) bar.setAttribute('content', themeColor);
        var text = document.getElementById('app-boot-text');
        if (text) {
          text.textContent = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? '正在加载…' : 'Loading…';
        }
        // 公开博客有自己的品牌与首屏骨架，不显示产品标识。
        if (/^\/blog(\/|$)/.test(location.pathname)) {
          root.classList.add('app-boot-off');
        }
      } catch (e) {
        /* 隐私模式 / 存储不可用：保持默认浅色即可 */
      }
    })();
  </script>

  <!--
    首屏字体补丁：同步执行，位置必须在 React 与业务请求之前。

    字体偏好存在服务端 config 表，HTML 到达时浏览器还不知道该用哪个字体，只能先用
    globals.css 的系统栈画首屏；等 config → fonts.list → getFontData 三段往返跑完
    才切到用户字体，刷新时会看到一次明显的跳变（FOUT）。

    这里在首帧之前把上次生效的 font-family 直接写进 <html> 的行内样式 —— 行内样式
    优先级高于外部样式表里的 :root 规则，所以即使 CSS 还没加载完也能生效。

    ⚠️ 下面三个 key 必须与 src/lib/fontPreference.ts 保持一致，
       由 scripts/tests/font-preference.test.ts 校验。
  -->
  <script>
    (function () {
      try {
        var stack = localStorage.getItem('ink:font-stack');
        if (stack) {
          document.documentElement.style.setProperty('--font-family', stack);
          document.documentElement.style.fontFamily = stack;
        }
        if (localStorage.getItem('ink:font-name') === 'LXGW WenKai') {
          var localCss = '/font-assets/lxgw-wenkai/1.7.0/startup-v2.css';
          var savedCss = localStorage.getItem('ink:font-css') || localCss;
          // Only transform our bundled stylesheet; preserve custom font URLs.
          var cssUrl = new URL(savedCss.replace(/\/font-assets\/lxgw-wenkai\/1\.7\.0\/(?:style(?:-v2)?|startup-v1)\.css$/, localCss), location.href);
          if (!/^https?:$/.test(cssUrl.protocol)) return;
          var bundled = cssUrl.pathname.endsWith(localCss);
          if (bundled) {
            [117, 118, 119].forEach(function (part) {
              var preload = document.createElement('link');
              preload.rel = 'preload';
              preload.as = 'font';
              preload.type = 'font/woff2';
              preload.crossOrigin = 'anonymous';
              preload.href = new URL('./files/lxgwwenkai-regular-subset-' + part + '.woff2', cssUrl).href;
              document.head.appendChild(preload);
            });
          }
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = cssUrl.href;
          link.setAttribute('data-font', 'LXGW WenKai');
          window.__inkWenkaiReady = new Promise(function (resolve) {
            var timer = setTimeout(resolve, 5000);
            link.onload = function () {
              var glyphs = document.fonts ? document.fonts.load('400 16px "LXGW WenKai"', '首页闪念笔记待办标签对话搜索设置今天保存 ABC123') : Promise.resolve();
              glyphs.then(function () { clearTimeout(timer); resolve(); }, function () { clearTimeout(timer); resolve(); });
            };
            var retried = false;
            link.onerror = function () {
              if (bundled && !retried && cssUrl.origin !== location.origin) {
                retried = true;
                link.href = localCss;
              } else {
                clearTimeout(timer);
                link.remove();
                resolve();
              }
            };
          });
          document.head.appendChild(link);
        }
      } catch (e) {
        /* 隐私模式 / 存储不可用：保持系统字体栈即可 */
      }
    })();
  </script>
</head>
