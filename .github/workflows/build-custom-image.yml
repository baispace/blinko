name: Build Custom Image

# 只在 custom 分支构建 —— 上游的 docker-build.yml 保持原样不动，互不干扰
on:
  push:
    branches:
      - custom
    paths-ignore:
      - '**.md'
      - 'custom/**'
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建平台（服务器通常是 linux/amd64；本地 Mac 调试用 linux/arm64）'
        required: false
        default: 'linux/amd64'
        type: string

# 同分支并发构建时取消旧的，省 Actions 额度
concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 读取上游版本号
        id: ver
        run: echo "blinko_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 确定构建平台
        id: plat
        run: echo "value=${{ inputs.platforms || 'linux/amd64' }}" >> "$GITHUB_OUTPUT"

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=custom
            type=sha,prefix=sha-,format=short
            type=raw,value=v${{ steps.ver.outputs.blinko_version }}-custom

      # 注意：官方 Dockerfile 文件名是小写的 dockerfile，必须显式指定
      # 构建用 bun（bun install + next build），内存需求高 —— 所以绝不要在 2核2G 服务器上本地构建
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: ${{ steps.plat.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            USE_MIRROR=true

      - name: 输出结果
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "平台: ${{ steps.plat.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "上游版本: v${{ steps.ver.outputs.blinko_version }}" >> "$GITHUB_STEP_SUMMARY"
