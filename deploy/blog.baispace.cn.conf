# 新版：应用内按 Host 分流；使用前在博客后台保存独立域名。
# 删除旧配置中的 /blog 路径改写，避免与应用分流重复。
server {
    listen 80;
    server_name blog.baispace.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://blog.baispace.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name blog.baispace.cn;
    ssl_certificate /etc/letsencrypt/live/blog.baispace.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.baispace.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        # Docker 内部署 Nginx 时，改为同网络的应用服务名:1111。
        proxy_pass http://127.0.0.1:1111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
